[pytest]
testpaths = tests
addopts = -q --strict-markers
asyncio_mode = auto
# Silences a PytestDeprecationWarning that fires on every run once pytest-asyncio
# is installed, whether or not any async test exists. Warning noise in a suite's
# output is how a real warning gets scrolled past.
asyncio_default_fixture_loop_scope = function
# A warning nobody sees is a warning nobody fixes, and the previous run's clean
# `-W error` was a one-off shell invocation that protected nothing. Configured
# here so the NEXT run fails on a new warning too.
filterwarnings =
    error

pythonpath = .
