# Dev/test only. Not part of the /srv/nebula stack -- this fork has not been
# adopted as a service, so it stays self-contained in its own repo.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: mxdiv-dev
    # Explicit despite matching the image's own CMD (Dockerfile.dev:22,
    # "npm run dev"). Set here rather than relying on the image default so
    # the `tools` service, which shares the image but sets its own command,
    # is unaffected by whatever this service runs.
    command: ["npm", "run", "dev"]
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # Optional: a fresh clone has no .env.local (it is gitignored), and the
    # short form makes compose exit 1 when the file is absent.
    env_file:
      - path: .env.local
        required: false
    environment:
      # Bind inside the container; the tailnet restriction is done by the
      # published-port address below, not by the app.
      DEV_HOST: 0.0.0.0
      # 8090 is one of three hardcoded copies of this port -- also the
      # literal in the `ports:` publish just below and the `|| 8090`
      # fallback in vite.config.ts. Compose cannot interpolate environment:
      # values into ports:, so there is no single source of truth: change
      # this alone and the container listens on the new port while the
      # publish still forwards to 8090 -- a dead publish next to a healthy
      # container and a "ready in Xms" log line. Change all three together.
      DEV_PORT: 8090
    ports:
      # Tailnet-only, same pattern as immich-ml. NEVER 0.0.0.0.
      # `:?` on purpose: if DEV_BIND_IP were unset, compose substitutes an
      # empty string and ":8090:8090" binds EVERY interface -- publishing the
      # dev server publicly. Hard-fail instead.
      #
      # Both 8090s here are the other two of three hardcoded copies of this
      # port -- see DEV_PORT above and the `|| 8090` fallback in
      # vite.config.ts. Change all three together or the publish and the
      # container end up on different ports.
      - "${DEV_BIND_IP:?DEV_BIND_IP unset - use ./scripts/dev.sh; refusing to bind all interfaces}:8090:8090"

  # One-shot runner: npm/vitest/lint without touching the host.
  tools:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    profiles: ["tools"]
    # Same image, same bind mount and the same repo as `app`, so the same
    # confinement. init: true also matters more here than there: without a
    # reaper as PID 1 a hung `vitest` or `vue-tsc` leaves zombies behind in a
    # container that is meant to be one-shot.
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - path: .env.local
        required: false
    entrypoint: []
    command: ["node", "--version"]

  # Headless browser for scripts/check-app-renders.mjs. Every other check in
  # this repo runs from the server's side; this one stands where the user does.
  browser:
    image: zenika/alpine-chrome:latest
    container_name: mxdiv-browser
    init: true
    security_opt:
      - no-new-privileges:true
    profiles: ["tools"]
    # Loopback only. Nothing is published: the tools container reaches it over
    # the compose network as browser:9222, and a DevTools endpoint is remote
    # code execution to anything that can talk to it.
    command:
      - --no-sandbox
      - --headless
      - --disable-gpu
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --remote-allow-origins=*
      - about:blank

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: mxdiv-api
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    working_dir: /srv/api
    volumes:
      - ./api:/srv/api
      - ./public/data:/srv/public/data:ro
      - api_snapshots:/srv/snapshots
      - api_db:/srv/db
    environment:
      TD2_DATA_DIR: /srv/public/data
      TD2_SNAPSHOT_DIR: /srv/snapshots
      TD2_DB_PATH: /srv/db/builds.db
      # The identity provider is fake until the owner registers a Discord app;
      # the endpoints are already the real ones. Two switches, not one: mode
      # alone does nothing without the explicit permission below, so a stray
      # TD2_AUTH_MODE=mock in a copied environment cannot turn real identity
      # off by itself.
      TD2_AUTH_MODE: mock
      TD2_ALLOW_MOCK_AUTH: "true"
      # Generated per invocation by scripts/dev.sh, never stored -- the same
      # derive-don't-store rule as DEV_BIND_IP. `:?` because compose renders an
      # unset variable as the empty string, and an empty signing secret is a
      # session anyone can forge; build_provider() refuses to start on one, so
      # this only changes WHERE the failure is reported.
      TD2_SESSION_SECRET: ${DEV_SESSION_SECRET:?run through ./scripts/dev.sh, which generates one}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      # Tailnet-only, same guard as the app service: an unset DEV_BIND_IP would
      # render ":8000:8000" and publish on every interface, so it hard-fails.
      #
      # 8000 is written in three places -- here, the --port below, and
      # Dockerfile.api's EXPOSE. Compose cannot interpolate one into the other,
      # so change all three together or the publish forwards to a dead port
      # while the container logs a healthy startup.
      - "${DEV_BIND_IP:?DEV_BIND_IP unset - use ./scripts/dev.sh; refusing to bind all interfaces}:8000:8000"
      # Loopback as well, and this one is load-bearing rather than convenience.
      # The session cookie is Secure, so a browser will only store it from a
      # trustworthy origin. A tailnet IP over plain http is not one -- but
      # http://localhost IS, by the secure-context rules every browser follows.
      # Without this line no browser can complete a login at all, and the
      # symptom is silent: the request 200s and no session appears.
      # 127.0.0.1 only, never 0.0.0.0 -- this must not widen the exposure the
      # line above deliberately restricts.
      - "127.0.0.1:8000:8000"

  api-tests:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    profiles: ["tools"]
    init: true
    security_opt:
      - no-new-privileges:true
    working_dir: /srv/api
    volumes:
      - ./api:/srv/api
      - ./public/data:/srv/public/data:ro
    environment:
      TD2_DATA_DIR: /srv/public/data
      # As of Task 5, create_app()'s lifespan constructs a SnapshotStore at
      # settings.snapshot_dir on every boot, including under TestClient in the
      # suite. Unlike the `api` service, nothing is mounted at the default
      # /srv/snapshots here, and /srv itself is root-owned -- SnapshotStore's
      # mkdir(parents=True) has no writable fallback, so every test that calls
      # create_app() would fail at startup with PermissionError. Measured:
      # `mkdir /srv/snapshots` inside this image exits 1, "Permission denied".
      # /tmp is world-writable regardless of image ownership.
      #
      # A floor, not the value the suite runs on: conftest.py's
      # isolated_snapshot_dir overrides this with a fresh pytest tmp dir per
      # run, so one run's promoted LIVE pointer cannot become the next run's
      # startup state. This value only applies to non-pytest entry into the
      # container (`run --rm api-tests python -c "..."`), which would otherwise
      # inherit the root-owned default and fail the same way.
      TD2_SNAPSHOT_DIR: /tmp/snapshots-fallback
      # create_app() refuses to build an unconfigured auth layer, and ~170
      # tests across the suite call it. Set here so those tests keep testing
      # what they are about; tests/test_auth.py clears all six TD2_AUTH*/
      # TD2_DISCORD* variables per test so it cannot pass on this ambient
      # value instead of on the code.
      TD2_AUTH_MODE: mock
      TD2_ALLOW_MOCK_AUTH: "true"
      # A literal, unlike the `api` service above: it signs nothing that
      # outlives a one-shot container, and the tests that care set their own.
      TD2_SESSION_SECRET: test-secret
    entrypoint: []
    command: ["pytest", "-q"]

volumes:
  node_modules:
  api_snapshots:
  api_db:
